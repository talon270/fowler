<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fowler</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#faf8f5">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #faf8f5; color: #1c1917;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #16140f; color: #f0ece4; } }
  main { max-width: 34rem; padding: 2rem; text-align: center; }
  h1 { font: 600 26px/1.2 Georgia, serif;
       border-top: 2px solid currentColor; padding-top: 10px; display: inline-block; }
  p { color: #57534e; }
  @media (prefers-color-scheme: dark) { p { color: #b4ada2; } }
  a { display: inline-block; margin-top: 1.2rem; padding: 10px 18px; border-radius: 8px;
      background: #9c2b3f; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Fowler</h1>
  <p>Near-synonym discrimination for essay prose and GRE/CAT verbal, drawn
     from real published quotations. Offline, no account, no telemetry.</p>
  <a href="fowler.html">Open</a>
</main>
<script>
  // Registered only over http(s). file:// has no secure context, so the app
  // simply runs without a service worker rather than logging a failure.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>
</body>
</html>
